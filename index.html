<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
          /* Colores del chat */
          div#n8n-chat .chat-header {
            background-color: #2563eb !important;
          }
          div#n8n-chat .chat-window-toggle {
            background-color: #2563eb !important;
          }

          /* 1. Alineación perfecta del contenedor */
          #n8n-chat .chat-input {
            display: grid !important;
            grid-template-columns: 1fr 45px !important;
            align-items: center !important; /* Centra verticalmente input y botón */
            gap: 10px !important;
            background: white !important;
            padding: 10px !important;
            border-top: 1px solid #eee !important;
          }
        
          /* 2. Ajuste del área de texto para que no tenga bordes feos */
          #n8n-chat .chat-input textarea {
            border: 1px solid #ccc !important;
            border-radius: 4px !important;
            padding: 10px !important;
            font-family: inherit !important;
            font-size: 14px !important;
            line-height: 1.5 !important;
            outline: none !important;
          }
        
          /* 3. El Botón: Color, tamaño e Icono */
          #n8n-chat .chat-input-send-button {
            background-color: #2563eb !important;
            border-radius: 6px !important;
            height: 38px !important;
            width: 42px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border: none !important;
            position: relative !important;
          }
        
          /* 4. Inyectamos un icono de flecha blanca */
          #n8n-chat .chat-input-send-button::before {
            content: "➤" !important; /* Puedes usar ➔ o un emoji como ✈️ */
            color: white !important;
            font-size: 18px !important;
          }
        
          /* 5. Ocultamos el SVG original de n8n para que no se amontone con nuestro icono */
          #n8n-chat .chat-input-send-button svg {
            display: none !important;
          }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
