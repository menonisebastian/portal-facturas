<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
          /* Colores del chat */
          div#n8n-chat .chat-header {
            background-color: #2563eb !important;
          }
          div#n8n-chat .chat-window-toggle {
            background-color: #2563eb !important;
          }

                 /* 1. Ajustamos el contenedor del pie de página para que tenga padding uniforme */
        #n8n-chat .chat-footer {
            padding: 15px !important; /* Mismo espacio por todos los lados */
            background-color: #f9f9f9 !important;
            border-top: 1px solid #eee !important;
            display: block !important;
        }
        
        /* 2. El contenedor del input ahora solo sirve para agrupar */
        #n8n-chat .chat-input {
            position: relative !important;
            display: flex !important;
            align-items: center !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 3. El textarea con el espacio reservado para el botón */
        #n8n-chat .chat-input textarea {
            width: 100% !important;
            padding: 12px 45px 12px 12px !important; /* Más espacio a la derecha para el botón */
            border: 1px solid #ddd !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            box-sizing: border-box !important;
            min-height: 45px !important;
        }
        
        /* 4. El botón centrado dentro del textarea */
        #n8n-chat .chat-input-send-button {
            position: absolute !important;
            right: 8px !important; /* Separación del borde derecho del textarea */
            background-color: #2563eb !important;
            border-radius: 6px !important;
            height: 32px !important;
            width: 32px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        
          /* 4. Inyectamos un icono de flecha blanca */
          #n8n-chat .chat-input-send-button::before {
            content: "➤" !important; /* Puedes usar ➔ o un emoji como ✈️ */
            color: white !important;
            font-size: 18px !important;
          }
        
          /* 5. Ocultamos el SVG original de n8n para que no se amontone con nuestro icono */
          #n8n-chat .chat-input-send-button svg {
            display: none !important;
          }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
