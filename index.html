<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
          /* Colores del chat */
          div#n8n-chat .chat-header {
            background-color: #2563eb !important;
          }
          div#n8n-chat .chat-window-toggle {
            background-color: #2563eb !important;
          }

           /* 1. Evitamos que el input pise al botón */
          #n8n-chat .chat-input {
            width: calc(100% - 50px) !important; /* Le quita espacio para que quepa el botón */
            flex: 1 !important;
            padding-right: 10px !important;
          }
        
          /* 2. Forzamos al botón a mantener su tamaño y estar al frente */
          #n8n-chat .chat-send-button {
            width: 40px !important;
            min-width: 40px !important;
            height: 40px !important;
            z-index: 10 !important; /* Lo pone por encima del input */
            cursor: pointer !important;
            pointer-events: auto !important;
            opacity: 1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
          }
        
          /* 3. Aseguramos que el contenedor del footer no los amontone */
          #n8n-chat .chat-footer {
            display: flex !important;
            align-items: center !important;
            gap: 5px !important; /* Espacio entre el texto y el botón */
          }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
