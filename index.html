<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
          /* Colores del chat */
          div#n8n-chat .chat-header {
            background-color: #2563eb !important;
          }
          div#n8n-chat .chat-window-toggle {
            background-color: #2563eb !important;
          }

           /* 1. Convertimos el contenedor del input en una cuadrícula */
          #n8n-chat .chat-input {
            display: grid !important;
            grid-template-columns: 1fr auto !important; /* El texto ocupa todo, el botón solo lo que necesita */
            align-items: end !important; /* Alinea el botón abajo si el texto crece */
            gap: 8px !important;
            padding: 8px !important;
            width: 100% !important;
            box-sizing: border-box !important;
          }
        
          /* 2. Ajustamos el cuadro de texto */
          #n8n-chat .chat-input textarea {
            width: 100% !important;
            resize: none !important;
            border: none !important;
            padding: 8px !important;
          }
        
          /* 3. Forzamos al botón a ser visible y clickable */
          #n8n-chat .chat-input-send-button {
            background-color: #2563eb !important; /* Tu azul */
            color: white !important;
            border-radius: 5px !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            opacity: 1 !important;
            min-width: 40px !important;
            height: 40px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
          }
        
          /* 4. Eliminamos el bloqueo visual de n8n */
          #n8n-chat .chat-input-send-button[disabled] {
            opacity: 1 !important;
            cursor: pointer !important;
            background-color: #2563eb !important;
          }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
