<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
          /* Colores del chat */
          div#n8n-chat .chat-header {
            background-color: #2563eb !important;
          }
          div#n8n-chat .chat-window-toggle {
            background-color: #2563eb !important;
          }

            /* Localizamos el botón de enviar dentro del chat */
          #n8n-chat button.chat-send-button {
            opacity: 1 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            display: flex !important;
          }
        
          /* Si el botón está visualmente oculto o deshabilitado por una clase */
          #n8n-chat button[disabled] {
            opacity: 1 !important;
            filter: none !important;
            cursor: pointer !important;
          }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
