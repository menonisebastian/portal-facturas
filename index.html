<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
          /* Colores del chat */
          div#n8n-chat .chat-header {
            background-color: #2563eb !important;
          }
          div#n8n-chat .chat-window-toggle {
            background-color: #2563eb !important;
          }

                 /* 1. Contenedor relativo para poder posicionar el botón dentro */
        #n8n-chat .chat-input {
            position: relative !important;
            display: block !important; /* Cambiamos de grid a block para controlar mejor el interior */
            padding: 5px !important;
            background: transparent !important;
        }

        /* 2. El input ocupa todo el ancho pero le restamos espacio a la derecha */
        #n8n-chat .chat-input textarea {
            width: 100% !important;
            box-sizing: border-box !important;
            padding-right: 50px !important; /* ESTO es lo que le resta tamaño al área de escritura */
            padding-left: 12px !important;
            padding-top: 10px !important;
            padding-bottom: 10px !important;
            border: 1px solid #ccc !important;
            border-radius: 8px !important;
            background: white !important;
            display: block !important;
        }
        
        /* 3. Posicionamos el botón DENTRO de la caja a la derecha */
        #n8n-chat .chat-input-send-button {
            position: absolute !important;
            right: 10px !important; /* Lo pegamos al borde derecho interno */
            top: 50% !important;
            transform: translateY(-50%) !important; /* Lo centramos verticalmente */
            height: 32px !important;
            width: 32px !important;
            background-color: #2563eb !important;
            border-radius: 6px !important;
            z-index: 5 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        
          /* 4. Inyectamos un icono de flecha blanca */
          #n8n-chat .chat-input-send-button::before {
            content: "➤" !important; /* Puedes usar ➔ o un emoji como ✈️ */
            color: white !important;
            font-size: 18px !important;
          }
        
          /* 5. Ocultamos el SVG original de n8n para que no se amontone con nuestro icono */
          #n8n-chat .chat-input-send-button svg {
            display: none !important;
          }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
