<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Facturas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://n8n-automatizacion.178.105.8.162.sslip.io/chat/style.css" rel="stylesheet" />
</head>
<body>

<div class="card">
    <h2>Registro de Facturas</h2>
    <p>Sube tu factura en formato PDF para procesarla en el sistema.</p>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="application/pdf" required>
        <button type="submit" id="submitBtn">Enviar a Procesar</button>
    </form>
    
    <div id="status"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
