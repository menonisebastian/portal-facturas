server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── GZIP ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Caché de assets estáticos (JS, CSS, SVG)
    location ~* \.(js|css|svg|png|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /login → serve login.html
    location = /login {
        try_files /login.html =404;
    }

    # /login.html → redirect to clean URL
    location = /login.html {
        return 301 /login;
    }

    # SPA fallback: all other routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
}
