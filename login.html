<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Acceso Seguro | Sysprovider</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #030086;
            --primary-light: #1111bb;
            --accent: #7473fd;
            --surface: #f5f3f3;
            --text: #1b1c1c;
            --text-muted: #454555;
            --error: #ba1a1a;
            --error-bg: #ffdad6;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background geometric decoration */
        .bg-decoration {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(17,17,187,0.08) 0%, transparent 70%);
        }
        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -15%;
            left: -8%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(116,115,253,0.1) 0%, transparent 70%);
        }
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(3,0,134,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(3,0,134,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* Card */
        .login-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border: 1px solid rgba(3,0,134,0.08);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow:
                0 2px 4px rgba(3,0,134,0.04),
                0 8px 24px rgba(3,0,134,0.08),
                0 32px 64px rgba(3,0,134,0.06);
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo area */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-icon svg { width: 28px; height: 28px; fill: white; }
        .logo-img {
            width: 160px;
            height: auto;
        }
        .logo-subtitle {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: -8px;
        }

        /* Divider */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(3,0,134,0.12), transparent);
            margin-bottom: 32px;
        }

        /* Heading */
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* Form */
        .field {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.2s;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border: 1.5px solid rgba(3,0,134,0.14);
            border-radius: 10px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="password"]:focus, input[type="text"]:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(17,17,187,0.1);
            background: #fff;
        }
        input[type="password"]:focus + svg,
        input[type="text"]:focus + svg { stroke: var(--primary-light); }
        /* Fix icon layering - icon must be before input in DOM for sibling selector */
        .input-wrapper input { order: 2; }

        /* Toggle password visibility */
        .toggle-vis {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }
        .toggle-vis svg {
            position: static;
            transform: none;
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .toggle-vis:hover { color: var(--primary); }

        /* Error alert */
        .error-alert {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--error-bg);
            border: 1px solid rgba(186,26,26,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--error);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        .error-alert.visible { display: flex; }
        .error-alert svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(3px); }
            30%, 50%, 70% { transform: translateX(-3px); }
            40%, 60% { transform: translateX(3px); }
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 16px rgba(3,0,134,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(3,0,134,0.35);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-submit svg {
            width: 16px; height: 16px;
            fill: none; stroke: white;
            stroke-width: 2.5;
            stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.2s;
        }
        .btn-submit:hover svg { transform: translateX(3px); }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        .card-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.04em;
            opacity: 0.7;
        }

        /* Attempt counter */
        .attempts-hint {
            text-align: right;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 600;
            min-height: 16px;
        }
        .attempts-hint.warning { color: var(--error); }
    </style>
</head>

    <script>
    // ─────────────────────────────────────────────
    // CONFIGURACIÓN
    // Cambia "sysprovider2025" por tu contraseña real antes de desplegar.
    // La contraseña se almacena como hash SHA-256 para que no sea visible en el código fuente.
    // Para generar el hash de tu contraseña, abre la consola del navegador y ejecuta:
    //   hashPassword('tu_nueva_contraseña').then(h => console.log(h))
    // Luego pega el resultado en PASSWORD_HASH:
    // ─────────────────────────────────────────────
    const PASSWORD_HASH = '7a79ac9faac0550acbd658e0954fd534565f5c038e3b36fac7d8261c886a6293'; // hash de: sysprovider2025
    const SESSION_KEY   = 'sp_portal_auth';
    const SESSION_TTL   = 8 * 60 * 60 * 1000; // 8 horas en ms
    const MAX_ATTEMPTS  = 5;
    const LOCKOUT_MS    = 15 * 60 * 1000; // 15 minutos de bloqueo

    // ─────────────────────────────────────────────
    // Función para hashear con SHA-256 (nativa, sin librerías)
    // ─────────────────────────────────────────────
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ─────────────────────────────────────────────
    // Gestión de estado de bloqueo (localStorage persiste el bloqueo)
    // ─────────────────────────────────────────────
    function getAttemptData() {
        try {
            const raw = localStorage.getItem('sp_login_attempts');
            return raw ? JSON.parse(raw) : { count: 0, lockedUntil: 0 };
        } catch { return { count: 0, lockedUntil: 0 }; }
    }

    function setAttemptData(data) {
        localStorage.setItem('sp_login_attempts', JSON.stringify(data));
    }

    function resetAttempts() {
        localStorage.removeItem('sp_login_attempts');
    }

    function isLocked() {
        const data = getAttemptData();
        if (data.lockedUntil && Date.now() < data.lockedUntil) return data.lockedUntil;
        return false;
    }

    // ─────────────────────────────────────────────
    // Verificar si ya hay sesión activa → redirigir al portal
    // ─────────────────────────────────────────────
    function checkExistingSession() {
        try {
            const raw = sessionStorage.getItem(SESSION_KEY);
            if (!raw) return false;
            const session = JSON.parse(raw);
            if (session.valid && Date.now() < session.expiresAt) {
                return true;
            }
            sessionStorage.removeItem(SESSION_KEY);
        } catch {}
        return false;
    }

    if (checkExistingSession()) {
        window.location.replace('/index.html');
    }

    // ─────────────────────────────────────────────
    // UI helpers
    // ─────────────────────────────────────────────
    const form        = document.getElementById('loginForm');
    const pwdInput    = document.getElementById('password');
    const errorAlert  = document.getElementById('errorAlert');
    const errorText   = document.getElementById('errorText');
    const submitBtn   = document.getElementById('submitBtn');
    const spinner     = document.getElementById('spinner');
    const arrowIcon   = document.getElementById('arrowIcon');
    const btnText     = document.getElementById('btnText');
    const attemptsHint = document.getElementById('attemptsHint');
    const toggleVis   = document.getElementById('toggleVis');
    const eyeIcon     = document.getElementById('eyeIcon');

    // Toggle contraseña visible/oculta
    toggleVis.addEventListener('click', () => {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type = isHidden ? 'text' : 'password';
        eyeIcon.innerHTML = isHidden
            ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    function showError(msg) {
        errorText.textContent = msg;
        errorAlert.classList.add('visible');
        // Re-trigger shake animation
        errorAlert.style.animation = 'none';
        errorAlert.offsetHeight; // reflow
        errorAlert.style.animation = '';
    }

    function hideError() {
        errorAlert.classList.remove('visible');
    }

    function setLoading(loading) {
        submitBtn.disabled = loading;
        spinner.style.display = loading ? 'block' : 'none';
        arrowIcon.style.display = loading ? 'none' : 'block';
        btnText.textContent = loading ? 'Verificando...' : 'Entrar al Portal';
    }

    function updateAttemptsUI() {
        const lockUntil = isLocked();
        if (lockUntil) {
            const mins = Math.ceil((lockUntil - Date.now()) / 60000);
            attemptsHint.textContent = `⛔ Bloqueado. Vuelve en ${mins} min.`;
            attemptsHint.classList.add('warning');
            submitBtn.disabled = true;
            pwdInput.disabled = true;
            return;
        }
        const data = getAttemptData();
        if (data.count > 0) {
            const left = MAX_ATTEMPTS - data.count;
            attemptsHint.textContent = `${left} intento${left !== 1 ? 's' : ''} restante${left !== 1 ? 's' : ''}`;
            attemptsHint.classList.toggle('warning', left <= 2);
        } else {
            attemptsHint.textContent = '';
            attemptsHint.classList.remove('warning');
        }
    }

    // Chequear bloqueo al cargar
    updateAttemptsUI();

    // Actualizar contador cada segundo si está bloqueado
    setInterval(() => {
        if (isLocked()) {
            updateAttemptsUI();
        } else if (submitBtn.disabled && pwdInput.disabled) {
            // Desbloquear si el tiempo expiró
            submitBtn.disabled = false;
            pwdInput.disabled = false;
            updateAttemptsUI();
            hideError();
        }
    }, 1000);

    // ─────────────────────────────────────────────
    // Submit handler
    // ─────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const lockUntil = isLocked();
        if (lockUntil) {
            const mins = Math.ceil((lockUntil - Date.now()) / 60000);
            showError(`Demasiados intentos. Espera ${mins} minuto${mins !== 1 ? 's' : ''}.`);
            return;
        }

        const password = pwdInput.value.trim();
        if (!password) {
            showError('Por favor, introduce la contraseña.');
            pwdInput.focus();
            return;
        }

        setLoading(true);

        // Hash de lo introducido y comparar
        const inputHash = await hashPassword(password);

        // Pequeño delay artificial para evitar timing attacks
        await new Promise(r => setTimeout(r, 400 + Math.random() * 200));

        if (inputHash === PASSWORD_HASH) {
            // ✅ Credenciales correctas
            resetAttempts();

            // Guardar sesión con TTL
            const session = {
                valid: true,
                expiresAt: Date.now() + SESSION_TTL
            };
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

            btnText.textContent = '¡Acceso concedido!';
            arrowIcon.style.display = 'none';

            // Redirigir al portal
            setTimeout(() => {
                window.location.replace('/index.html');
            }, 500);

        } else {
            // ❌ Contraseña incorrecta
            setLoading(false);
            pwdInput.value = '';
            pwdInput.focus();

            const data = getAttemptData();
            data.count = (data.count || 0) + 1;

            if (data.count >= MAX_ATTEMPTS) {
                data.lockedUntil = Date.now() + LOCKOUT_MS;
                setAttemptData(data);
                showError(`Cuenta bloqueada por 15 minutos tras ${MAX_ATTEMPTS} intentos fallidos.`);
            } else {
                setAttemptData(data);
                const left = MAX_ATTEMPTS - data.count;
                showError(`Contraseña incorrecta. ${left} intento${left !== 1 ? 's' : ''} restante${left !== 1 ? 's' : ''}.`);
            }
            updateAttemptsUI();
        }
    });

    pwdInput.addEventListener('input', hideError);
    </script>
</body>
</html>
