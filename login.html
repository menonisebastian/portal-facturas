<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Acceso Seguro | Sysprovider</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logosys.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/src/css/login.css">
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="grid-overlay"></div>

    <div class="login-card">
        <div class="logo-area">
            <!-- Sysprovider logo inline SVG (gradient version) -->
            <img src="/assets/LOGO_SYSPROVIDER_DEGRADADO.svg" alt="Sysprovider Logo" class="w-full h-auto max-h-12 object-contain filter dark:brightness-200">
            <p class="logo-subtitle">Portal de Facturas</p>
        </div>

        <div class="divider"></div>

        <h1>Acceso Privado</h1>
        <p class="subtitle">Introduce tu contraseña para continuar.</p>

        <div class="error-alert" id="errorAlert">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="errorText">Contraseña incorrecta. Inténtalo de nuevo.</span>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="••••••••••"
                        required
                    />
                    <!-- Lock icon - positioned via CSS absolute -->
                    <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#454555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <button type="button" class="toggle-vis" id="toggleVis" title="Mostrar/ocultar contraseña" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="attempts-hint" id="attemptsHint"></div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Entrar al Portal</span>
                <div class="spinner" id="spinner"></div>
                <svg id="arrowIcon" viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>

        <p class="card-footer">Acceso restringido · Sysprovider SL</p>
    </div>

    <script>
    // ─────────────────────────────────────────────
    // CONFIGURACIÓN
    // Cambia "sysprovider2025" por tu contraseña real antes de desplegar.
    // La contraseña se almacena como hash SHA-256 para que no sea visible en el código fuente.
    // Para generar el hash de tu contraseña, abre la consola del navegador y ejecuta:
    //   hashPassword('tu_nueva_contraseña').then(h => console.log(h))
    // Luego pega el resultado en PASSWORD_HASH:
    // ─────────────────────────────────────────────
    const PASSWORD_HASH = '50cfb27f0bbdec85ff8e423a99aade88aca47f5808df1a37786e332d2aadfbef'; // hash de: sysprovider2025
    const SESSION_KEY   = 'sp_portal_auth';
    const SESSION_TTL   = 8 * 60 * 60 * 1000; // 8 horas en ms
    const MAX_ATTEMPTS  = 5;
    const LOCKOUT_MS    = 15 * 60 * 1000; // 15 minutos de bloqueo

    // ─────────────────────────────────────────────
    // Función para hashear con SHA-256 (nativa, sin librerías)
    // ─────────────────────────────────────────────
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ─────────────────────────────────────────────
    // Gestión de estado de bloqueo (localStorage persiste el bloqueo)
    // ─────────────────────────────────────────────
    function getAttemptData() {
        try {
            const raw = localStorage.getItem('sp_login_attempts');
            return raw ? JSON.parse(raw) : { count: 0, lockedUntil: 0 };
        } catch { return { count: 0, lockedUntil: 0 }; }
    }

    function setAttemptData(data) {
        localStorage.setItem('sp_login_attempts', JSON.stringify(data));
    }

    function resetAttempts() {
        localStorage.removeItem('sp_login_attempts');
    }

    function isLocked() {
        const data = getAttemptData();
        if (data.lockedUntil && Date.now() < data.lockedUntil) return data.lockedUntil;
        return false;
    }

    // ─────────────────────────────────────────────
    // Verificar si ya hay sesión activa → redirigir al portal
    // ─────────────────────────────────────────────
    function checkExistingSession() {
        try {
            const raw = sessionStorage.getItem(SESSION_KEY);
            if (!raw) return false;
            const session = JSON.parse(raw);
            if (session.valid && Date.now() < session.expiresAt) {
                return true;
            }
            sessionStorage.removeItem(SESSION_KEY);
        } catch {}
        return false;
    }

    if (checkExistingSession()) {
        window.location.replace('/dashboard');
    }

    // ─────────────────────────────────────────────
    // UI helpers
    // ─────────────────────────────────────────────
    const form        = document.getElementById('loginForm');
    const pwdInput    = document.getElementById('password');
    const errorAlert  = document.getElementById('errorAlert');
    const errorText   = document.getElementById('errorText');
    const submitBtn   = document.getElementById('submitBtn');
    const spinner     = document.getElementById('spinner');
    const arrowIcon   = document.getElementById('arrowIcon');
    const btnText     = document.getElementById('btnText');
    const attemptsHint = document.getElementById('attemptsHint');
    const toggleVis   = document.getElementById('toggleVis');
    const eyeIcon     = document.getElementById('eyeIcon');

    // Toggle contraseña visible/oculta
    toggleVis.addEventListener('click', () => {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type = isHidden ? 'text' : 'password';
        eyeIcon.innerHTML = isHidden
            ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    function showError(msg) {
        errorText.textContent = msg;
        errorAlert.classList.add('visible');
        // Re-trigger shake animation
        errorAlert.style.animation = 'none';
        errorAlert.offsetHeight; // reflow
        errorAlert.style.animation = '';
    }

    function hideError() {
        errorAlert.classList.remove('visible');
    }

    function setLoading(loading) {
        submitBtn.disabled = loading;
        spinner.style.display = loading ? 'block' : 'none';
        arrowIcon.style.display = loading ? 'none' : 'block';
        btnText.textContent = loading ? 'Verificando...' : 'Entrar al Portal';
    }

    function updateAttemptsUI() {
        const lockUntil = isLocked();
        if (lockUntil) {
            const mins = Math.ceil((lockUntil - Date.now()) / 60000);
            attemptsHint.textContent = `⛔ Bloqueado. Vuelve en ${mins} min.`;
            attemptsHint.classList.add('warning');
            submitBtn.disabled = true;
            pwdInput.disabled = true;
            return;
        }
        const data = getAttemptData();
        if (data.count > 0) {
            const left = MAX_ATTEMPTS - data.count;
            attemptsHint.textContent = `${left} intento${left !== 1 ? 's' : ''} restante${left !== 1 ? 's' : ''}`;
            attemptsHint.classList.toggle('warning', left <= 2);
        } else {
            attemptsHint.textContent = '';
            attemptsHint.classList.remove('warning');
        }
    }

    // Chequear bloqueo al cargar
    updateAttemptsUI();

    // Actualizar contador cada segundo si está bloqueado
    setInterval(() => {
        if (isLocked()) {
            updateAttemptsUI();
        } else if (submitBtn.disabled && pwdInput.disabled) {
            // Desbloquear si el tiempo expiró
            submitBtn.disabled = false;
            pwdInput.disabled = false;
            updateAttemptsUI();
            hideError();
        }
    }, 1000);

    // ─────────────────────────────────────────────
    // Submit handler
    // ─────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const lockUntil = isLocked();
        if (lockUntil) {
            const mins = Math.ceil((lockUntil - Date.now()) / 60000);
            showError(`Demasiados intentos. Espera ${mins} minuto${mins !== 1 ? 's' : ''}.`);
            return;
        }

        const password = pwdInput.value.trim();
        if (!password) {
            showError('Por favor, introduce la contraseña.');
            pwdInput.focus();
            return;
        }

        setLoading(true);

        // Hash de lo introducido y comparar
        const inputHash = await hashPassword(password);

        // Pequeño delay artificial para evitar timing attacks
        await new Promise(r => setTimeout(r, 400 + Math.random() * 200));

        if (inputHash === PASSWORD_HASH) {
            // ✅ Credenciales correctas
            resetAttempts();

            // Guardar sesión con TTL
            const session = {
                valid: true,
                expiresAt: Date.now() + SESSION_TTL
            };
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

            btnText.textContent = '¡Acceso concedido!';
            arrowIcon.style.display = 'none';

            // Redirigir al portal
            setTimeout(() => {
                window.location.replace('/dashboard');
            }, 500);

        } else {
            // ❌ Contraseña incorrecta
            setLoading(false);
            pwdInput.value = '';
            pwdInput.focus();

            const data = getAttemptData();
            data.count = (data.count || 0) + 1;

            if (data.count >= MAX_ATTEMPTS) {
                data.lockedUntil = Date.now() + LOCKOUT_MS;
                setAttemptData(data);
                showError(`Cuenta bloqueada por 15 minutos tras ${MAX_ATTEMPTS} intentos fallidos.`);
            } else {
                setAttemptData(data);
                const left = MAX_ATTEMPTS - data.count;
                showError(`Contraseña incorrecta. ${left} intento${left !== 1 ? 's' : ''} restante${left !== 1 ? 's' : ''}.`);
            }
            updateAttemptsUI();
        }
    });

    pwdInput.addEventListener('input', hideError);
    </script>
</body>
</html>
